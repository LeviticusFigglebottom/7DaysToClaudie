name: Stand-ins

# The game as a fresh clone runs it: no Blender, no `make assets`, every model, texture and sound
# a procedural stand-in (ADR-0036). The first human playtest ran exactly this mode on Windows and
# crashed; nothing else in CI exercised it. Cheap (Godot only, ~10 min), so it runs on every push.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: standin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standin:
    name: Import, check, tests, smoke and walk tour without generated assets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache pinned Godot (.tools/godot)
        uses: actions/cache@v4
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ hashFiles('tools/versions.env') }}

      - name: Setup Godot
        run: make setup-godot

      - name: No generated assets
        run: test ! -e game/assets/generated

      - name: Import
        run: make import

      - name: Compile check
        run: |
          make check | tee build/check.log
          grep -q ", 0 failed" build/check.log

      - name: Tests
        run: make test

      - name: Smoke (slice end to end)
        run: |
          set -o pipefail
          make smoke 2>&1 | tee build/smoke.log
          ! grep -n "SCRIPT ERROR" build/smoke.log

      - name: Walk tour (run into, hit and use everything)
        run: |
          set -o pipefail
          make tour 2>&1 | tee build/tour.log
          ! grep -n "SCRIPT ERROR" build/tour.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standin-logs
          path: |
            build/test-results/
            build/*.log
