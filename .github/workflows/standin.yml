name: Stand-ins

# The game as a fresh clone runs it: no Blender, no `make assets`, every model, texture and sound
# a procedural stand-in (ADR-0036). The first human playtest ran exactly this mode on Windows and
# crashed; nothing else in CI exercised it. Cheap (Godot only, ~10 min), so it runs on every push.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: standin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standin:
    name: Import, check, tests, smoke and walk tour without generated assets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache pinned Godot (.tools/godot)
        uses: actions/cache@v4
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ hashFiles('tools/versions.env') }}

      - name: Setup Godot
        run: make setup-godot

      - name: No generated assets
        run: test ! -e game/assets/generated

      - name: Import
        run: make import

      - name: Compile check
        run: |
          make check | tee build/check.log
          grep -q ", 0 failed" build/check.log

      - name: Tests
        run: make test

      # `make smoke` / `make tour` log to build/logs/ and fail on any ERROR / SCRIPT ERROR line
      # not in tools/qa/log_error_allowlist.txt (TD-103), as well as on the run's own exit code.
      - name: Smoke (slice end to end)
        run: make smoke

      - name: Smoke (random world)
        run: make smoke SMOKE_ARGS="--world random --world-seed 7 --world-set size=5" SMOKE_LOG=smoke_random

      - name: Walk tour (run into, hit and use everything)
        run: make tour

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standin-logs
          path: |
            build/test-results/
            build/*.log
            build/logs/

  rendered:
    name: Rendered town views without renderer errors (software Vulkan)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: System packages (software Vulkan under Xvfb)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb mesa-vulkan-drivers libvulkan1 libxi6 libxxf86vm1 libxfixes3 \
            libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 libxcursor1 libxinerama1 libxrandr2

      - name: Cache pinned Godot (.tools/godot)
        uses: actions/cache@v4
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ hashFiles('tools/versions.env') }}

      - name: Setup Godot
        run: make setup-godot

      - name: Import
        run: make import

      # The first playtest crashed on a reflection probe atlas overflow on Pell's Crossing's street;
      # only a rendered run shows that class of error.
      - name: Render the town and fail on renderer errors
        run: make render-check

      - name: Upload renders and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-check
          path: build/render_check/
